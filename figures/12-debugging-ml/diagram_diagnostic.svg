  <title id="figDiagnosticTitle">The optimisation-versus-objective test along a training run</title>
  <desc id="figDiagnosticDesc">The regularised log-likelihood of a toy spam problem along gradient ascent, on a logarithmic step axis, with a dashed line at the value the SVM's parameters reach. The SVM wins on weighted accuracy throughout. After a single step logistic regression already scores above the SVM on its own objective, so the test reports that the objective is at fault, although the optimiser needs about thirty more steps to come within one per cent of its optimum.</desc>
