  <title id="figPipelineTitle">Error analysis of a face-recognition pipeline</title>
  <desc id="figPipelineDesc">Top, the pipeline: camera image, background removal, face detection, separate eye, nose and mouth segmentation, and logistic regression producing the label. Bottom, the overall accuracy of 85 per cent and the accuracy after replacing each component, cumulatively from the left, with ground truth: 85.1, 91, 95, 96, 97 and 100. Face detection and eye segmentation account for the largest gains.</desc>
