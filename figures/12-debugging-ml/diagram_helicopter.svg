<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="img" aria-labelledby="figHeliTitle figHeliDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figHeliTitle">Diagnosing the helicopter controller</title>
  <desc id="figHeliDesc">A decision flow. A controller that flies badly on the real helicopter is first tried in simulation; if it flies well there, the simulator is at fault. If not, the human pilot's cost under the squared-error function is compared with the controller's: if the human scores lower, the reinforcement-learning algorithm failed to minimise the cost; if the human scores higher while flying better, the cost function is wrong.</desc>
  <rect x="20.0" y="120.0" width="150.0" height="50.0" fill="#3b528b" fill-opacity="0.22" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="95.0" y="142.0" font-size="12" fill="currentColor" text-anchor="middle">θ_RL flies badly</text>
  <text x="95.0" y="158.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.75">on the real helicopter</text>
  <rect x="220.0" y="120.0" width="170.0" height="50.0" fill="#21918c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="305.0" y="149.0" font-size="12" fill="currentColor" text-anchor="middle">Flies well in simulation?</text>
  <rect x="220.0" y="230.0" width="170.0" height="50.0" fill="#5ec962" fill-opacity="0.35" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="305.0" y="252.0" font-size="12" fill="currentColor" text-anchor="middle">Simulator</text>
  <text x="305.0" y="268.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.75">fix the simulator</text>
  <rect x="440.0" y="120.0" width="180.0" height="50.0" fill="#21918c" fill-opacity="0.22" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="530.0" y="149.0" font-size="12" fill="currentColor" text-anchor="middle">J(θ_human) &lt; J(θ_RL)?</text>
  <rect x="440.0" y="20.0" width="180.0" height="50.0" fill="#5ec962" fill-opacity="0.35" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="530.0" y="42.0" font-size="12" fill="currentColor" text-anchor="middle">RL algorithm</text>
  <text x="530.0" y="58.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.75">fix the optimiser</text>
  <rect x="440.0" y="230.0" width="180.0" height="50.0" fill="#5ec962" fill-opacity="0.35" stroke="currentColor" stroke-width="1.0" stroke-opacity="1.0" rx="6"/>
  <text x="530.0" y="252.0" font-size="12" fill="currentColor" text-anchor="middle">Cost function</text>
  <text x="530.0" y="268.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.75">fix J</text>
  <line x1="170.0" y1="145.0" x2="212.0" y2="145.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="218.0,145.0 212.0,147.7 212.0,142.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="305.0" y1="170.0" x2="305.0" y2="222.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="305.0,228.0 302.3,222.0 307.7,222.0" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="312.0" y="204.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">yes</text>
  <line x1="390.0" y1="145.0" x2="432.0" y2="145.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="438.0,145.0 432.0,147.7 432.0,142.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="414.0" y="138.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">no</text>
  <line x1="530.0" y1="120.0" x2="530.0" y2="78.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="530.0,72.0 532.7,78.0 527.3,78.0" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="537.0" y="100.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">yes</text>
  <line x1="530.0" y1="170.0" x2="530.0" y2="222.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="530.0,228.0 527.3,222.0 532.7,222.0" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="537.0" y="204.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">no</text>
</svg>
