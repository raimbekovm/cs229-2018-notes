<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290"
     role="img" aria-labelledby="figLearningTitle figLearningDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figLearningTitle">REINFORCE learning curves at two step sizes</title>
  <desc id="figLearningDesc">Exact expected payoff of the current policy against the number of updates, averaged over 20 runs, for three estimators of the same gradient: the whole payoff multiplying every score term, as in the lecture; each action's score multiplied only by the rewards from that step on; and the same with a baseline subtracted. At the smaller step size all three reach the best policy, the lecture's version last. At the larger one the two lower-variance versions converge within about a hundred updates, while the lecture's version dips and some of its runs stall on a poor policy.</desc>
