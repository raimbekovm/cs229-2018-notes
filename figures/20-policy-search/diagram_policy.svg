  <title id="figPolicyTitle">The logistic policy for the inverted pendulum</title>
  <desc id="figPolicyDesc">Probability of accelerating right against the pole angle. With the lecture's weight of 1 on the angle the curve stays between 0.38 and 0.62 over half a radian either way, close to a coin flip. With a weight of 10 it is nearly a step. Moving the cart one unit right with a weight of minus a half on position shifts both curves to the right, so the policy needs a larger tilt before it pushes right.</desc>
