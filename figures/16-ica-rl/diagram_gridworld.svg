  <title id="figGridTitle">The 11-state gridworld and its optimal policy</title>
  <desc id="figGridDesc">Left: a four-by-three grid with a wall at column two, row two, a plus-one cell at the top right and a minus-one cell below it; every other cell carries a reward of minus 0.02. From cell (3, 1), a command to go North reaches (3, 2) with probability 0.8 and slips West or East with probability 0.1 each. Right: the optimal policy. From the bottom row the robot goes West and round by the top, rather than North past the minus-one cell.</desc>
