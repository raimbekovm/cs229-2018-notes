  <title id="figLearningRateTitle">The learning rate</title>
  <desc id="figLearningRateDesc">Three copies of the parabola J of theta equals theta squared. With a small learning rate the iterates creep down one side; with a moderate one they reach the bottom in a few steps; with one above the stability limit each step overshoots to the other side, higher than before.</desc>
