  <title id="figForestTitle">Bagging and random forests as trees are added</title>
  <desc id="figForestDesc">Test error of an average of M regression trees, each grown on a bootstrap sample, for plain bagging and for a random forest that considers three of eight redundant noisy features at each split. Both fall steeply over the first few trees and then flatten; neither rises as trees are added, and the forest ends a little lower. A single fully grown tree is far worse.</desc>
