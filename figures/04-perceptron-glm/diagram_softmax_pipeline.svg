  <title id="figSoftmaxTitle">Softmax regression for one example</title>
  <desc id="figSoftmaxDesc">Four bar charts over the classes circle, triangle and square. The logits are minus 0.5, 0.8 and 2.2; exponentiating makes all three positive; dividing by their sum gives probabilities that add to one, with the square largest. The label is triangle, shown as a one-hot distribution, and the loss is minus the log of the probability assigned to triangle.</desc>
