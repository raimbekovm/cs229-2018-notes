  <title id="figExploreTitle">A greedy learner can settle for the nearer, smaller reward</title>
  <desc id="figExploreDesc">Left: an eight-cell corridor. The robot starts in cell five; a plus-ten reward sits five cells to the left and a plus-one two cells to the right, with a small cost per step. Right: over 200 independent learners, the fraction whose current policy heads for the plus-ten, by episode. A purely greedy learner reaches about six in ten after 150 episodes, because the runs that find the plus-one first rarely leave it; with epsilon 0.2 nearly eight in ten do.</desc>
