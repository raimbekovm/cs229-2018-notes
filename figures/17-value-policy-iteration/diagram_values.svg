  <title id="figValuesTitle">The value of a poor policy and the optimal value function</title>
  <desc id="figValuesDesc">Two copies of the gridworld. Left: a policy that always commands East, with the value of every state under it: 0.59 to 0.76 along the top row, which leads into the plus-one, and minus 0.3 to minus 1.09 below, where the robot runs into the minus-one or stalls against the wall. Right: the optimal policy and the optimal values, from 0.49 at the bottom right to 0.93 next to the plus-one. Cell (3, 1) is highlighted: its optimal action is West.</desc>
