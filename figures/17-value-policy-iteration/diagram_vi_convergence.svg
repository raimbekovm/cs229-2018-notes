<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="img" aria-labelledby="figViTitle figViDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figViTitle">Value iteration converges geometrically</title>
  <desc id="figViDesc">Base-ten logarithm of the largest error in the value function against the number of sweeps, for the gridworld. Every curve falls below one in a hundred million within about 35 sweeps, at either discount factor; asynchronous sweeps, which use each new value at once, fall faster than synchronous ones. The dotted lines show the general guarantee, gamma to the k times the initial error, which at 0.99 has barely moved after 40 sweeps.</desc>
