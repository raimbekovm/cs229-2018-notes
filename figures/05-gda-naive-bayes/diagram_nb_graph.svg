<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215"
     role="img" aria-labelledby="figNbGraphTitle figNbGraphDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figNbGraphTitle">The naive Bayes assumption as a graphical model</title>
  <desc id="figNbGraphDesc">A node for the label y with arrows to one node per word indicator, x1 for the word a, x2 for aardvark, x3 for aardwolf, through x10000 for zymurgy. There are no edges between the word nodes: given the label, each word's presence is independent of every other's.</desc>
  <circle cx="360.0" cy="46.0" r="22.0" fill="#21918c" fill-opacity="0.15" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0"/>
  <text x="360.0" y="51.0" font-size="16" fill="currentColor" text-anchor="middle" font-style="italic">y</text>
  <text x="394.0" y="51.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">spam or not</text>
  <line x1="316.8" y1="68.0" x2="154.4" y2="133.7" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="148.8,136.0 153.3,131.2 155.4,136.3" fill="currentColor" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="120.0" cy="158.0" r="22.0" fill="none" fill-opacity="1.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0"/>
  <text x="120.0" y="163.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">x₁</text>
  <text x="120.0" y="198.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">“a”</text>
  <line x1="338.4" y1="68.0" x2="259.1" y2="132.2" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="254.4,136.0 257.4,130.1 260.8,134.3" fill="currentColor" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="240.0" cy="158.0" r="22.0" fill="none" fill-opacity="1.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0"/>
  <text x="240.0" y="163.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">x₂</text>
  <text x="240.0" y="198.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">“aardvark”</text>
  <line x1="360.0" y1="68.0" x2="360.0" y2="130.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="360.0,136.0 357.3,130.0 362.7,130.0" fill="currentColor" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="360.0" cy="158.0" r="22.0" fill="none" fill-opacity="1.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0"/>
  <text x="360.0" y="163.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">x₃</text>
  <text x="360.0" y="198.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">“aardwolf”</text>
  <text x="480.0" y="158.0" font-size="20" fill="currentColor" text-anchor="middle">⋯</text>
  <line x1="403.2" y1="68.0" x2="565.6" y2="133.7" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="571.2,136.0 564.6,136.3 566.7,131.2" fill="currentColor" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="600.0" cy="158.0" r="22.0" fill="none" fill-opacity="1.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0"/>
  <text x="600.0" y="163.0" font-size="10" fill="currentColor" text-anchor="middle" font-style="italic">x₁₀₀₀₀</text>
  <text x="600.0" y="198.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">“zymurgy”</text>
</svg>
