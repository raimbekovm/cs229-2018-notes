  <title id="figMarginsTitle">The geometric margin of one training example</title>
  <desc id="figMarginsDesc">A decision boundary w transpose x plus b equals zero, with w equal to (2, 1) and b equal to minus 2, drawn as a line. The vector w points away from the line at a right angle, into the half-plane where the classifier predicts plus one. A positive example A sits in that half-plane, and a dashed segment drops from it at a right angle to the point B on the line; the length of that segment is the geometric margin gamma i.</desc>
