<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 236" width="580" height="236"
     role="img" aria-labelledby="figNeuronTitle figNeuronDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figNeuronTitle">Logistic regression drawn as one neuron</title>
  <desc id="figNeuronDesc">A 64 by 64 colour image has three channels, so it is 12,288 numbers. Flattened into a column vector x, every entry is connected by its own weight to a single neuron, which computes a linear part z = wx + b and then the sigmoid activation a = σ(z). The output a is the predicted probability that the image contains a cat.</desc>
  <rect x="58.0" y="64.0" width="92.0" height="92.0" fill="#440154" fill-opacity="0.28" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <rect x="49.0" y="73.0" width="92.0" height="92.0" fill="#5ec962" fill-opacity="0.28" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <rect x="40.0" y="82.0" width="92.0" height="92.0" fill="#3b528b" fill-opacity="0.28" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="97.0" y="186.0" font-size="12" fill="currentColor" text-anchor="middle">64 × 64 × 3 image</text>
  <text x="97.0" y="202.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">R, G, B channels</text>
  <line x1="160.0" y1="112.0" x2="208.0" y2="112.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="214.0,112.0 208.0,114.7 208.0,109.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="187.0" y="100.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">flatten</text>
  <rect x="236.0" y="48.0" width="26.0" height="20.0" fill="#3b528b" fill-opacity="0.12" stroke="#3b528b" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="249.0" y="62.0" font-size="11" fill="currentColor" text-anchor="middle">x₁</text>
  <rect x="236.0" y="70.0" width="26.0" height="20.0" fill="#3b528b" fill-opacity="0.12" stroke="#3b528b" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="249.0" y="84.0" font-size="11" fill="currentColor" text-anchor="middle">x₂</text>
  <rect x="236.0" y="92.0" width="26.0" height="20.0" fill="#3b528b" fill-opacity="0.12" stroke="#3b528b" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="249.0" y="106.0" font-size="11" fill="currentColor" text-anchor="middle">x₃</text>
  <text x="249.0" y="129.0" font-size="14" fill="currentColor" text-anchor="middle">⋮</text>
  <rect x="236.0" y="180.0" width="26.0" height="20.0" fill="#3b528b" fill-opacity="0.12" stroke="#3b528b" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="249.0" y="194.0" font-size="11" fill="currentColor" text-anchor="middle">xₙ</text>
  <text x="249.0" y="222.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.8">n = 12,288</text>
  <line x1="262.0" y1="58.0" x2="394.0" y2="112.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.45"/>
  <line x1="262.0" y1="80.0" x2="394.0" y2="112.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.45"/>
  <line x1="262.0" y1="102.0" x2="394.0" y2="112.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.45"/>
  <line x1="262.0" y1="190.0" x2="394.0" y2="112.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="330.0" y="214.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">one weight per edge</text>
  <circle cx="420.0" cy="112.0" r="30.0" fill="#21918c" fill-opacity="0.18" stroke="#21918c" stroke-width="1.6" stroke-opacity="1.0"/>
  <line x1="420.0" y1="82.0" x2="420.0" y2="142.0" stroke="#21918c" stroke-width="1.0" stroke-opacity="0.6"/>
  <text x="406.0" y="116.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">z</text>
  <text x="434.0" y="116.0" font-size="13" fill="currentColor" text-anchor="middle">σ</text>
  <text x="420.0" y="162.0" font-size="12" fill="currentColor" text-anchor="middle">z = wx + b</text>
  <text x="420.0" y="178.0" font-size="12" fill="currentColor" text-anchor="middle">a = σ(z)</text>
  <text x="420.0" y="70.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.75">linear | activation</text>
  <line x1="450.0" y1="112.0" x2="500.0" y2="112.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="506.0,112.0 500.0,114.7 500.0,109.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="532.0" y="117.0" font-size="13" fill="currentColor" text-anchor="middle">ŷ = a</text>
  <text x="532.0" y="135.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">P(cat)</text>
</svg>
