  <title id="figShapesTitle">The three-layer network and its shapes</title>
  <desc id="figShapesDesc">An n-dimensional input feeds a layer of three neurons, then a layer of two, then one output neuron. Under each layer are its parameters and their shapes: W[1] is 3 by n and b[1] is 3 by 1; W[2] is 2 by 3 and b[2] is 2 by 1; W[3] is 1 by 2 and b[3] is 1 by 1. The linear parts z and activations a of each layer are column vectors with one entry per neuron.</desc>
