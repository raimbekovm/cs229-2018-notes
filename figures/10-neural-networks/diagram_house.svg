  <title id="figHouseTitle">A house-price network wired by hand and fully connected</title>
  <desc id="figHouseDesc">Four inputs, size, bedrooms, zip code and wealth of the neighbourhood, feed three hidden neurons and one output, the price. On the left the edges are chosen by hand so that each hidden neuron computes a named quantity: family size from size and bedrooms, walkability from the zip code, school quality from zip code and wealth. On the right every input is connected to every hidden neuron and the hidden neurons are unnamed: what each computes is left to training.</desc>
