<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270"
     role="img" aria-labelledby="figSoftmaxTitle figSoftmaxDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figSoftmaxTitle">Independent sigmoids against a softmax</title>
  <desc id="figSoftmaxDesc">The same three logits, 2.0 for cat, 1.5 for lion and −1.0 for iguana, are passed through three independent sigmoids on the left and through a softmax on the right. The sigmoids give 0.88, 0.82 and 0.27, which sum to 1.97 and can say cat and lion at once; the softmax gives 0.60, 0.37 and 0.03, a distribution over the three classes that sums to one.</desc>
  <line x1="70.0" y1="210.0" x2="280.0" y2="210.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <line x1="70.0" y1="210.0" x2="70.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <line x1="66.0" y1="210.0" x2="70.0" y2="210.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="62.0" y="214.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">0</text>
  <line x1="66.0" y1="130.0" x2="70.0" y2="130.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="62.0" y="134.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">0.5</text>
  <line x1="70.0" y1="130.0" x2="280.0" y2="130.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.12"/>
  <line x1="66.0" y1="50.0" x2="70.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="62.0" y="54.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">1</text>
  <line x1="70.0" y1="50.0" x2="280.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.12"/>
  <rect x="84.0" y="69.1" width="42.0" height="140.9" fill="#440154" fill-opacity="0.55" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="105.0" y="63.1" font-size="11" fill="currentColor" text-anchor="middle">0.88</text>
  <text x="105.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">cat</text>
  <rect x="154.0" y="79.2" width="42.0" height="130.8" fill="#440154" fill-opacity="0.55" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="175.0" y="73.2" font-size="11" fill="currentColor" text-anchor="middle">0.82</text>
  <text x="175.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">lion</text>
  <rect x="224.0" y="167.0" width="42.0" height="43.0" fill="#440154" fill-opacity="0.55" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="245.0" y="161.0" font-size="11" fill="currentColor" text-anchor="middle">0.27</text>
  <text x="245.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">iguana</text>
  <text x="175.0" y="30.0" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">three sigmoids</text>
  <text x="175.0" y="256.0" font-size="12" fill="#440154" text-anchor="middle">outputs sum to 1.97</text>
  <line x1="370.0" y1="210.0" x2="580.0" y2="210.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <line x1="370.0" y1="210.0" x2="370.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <line x1="366.0" y1="210.0" x2="370.0" y2="210.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="362.0" y="214.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">0</text>
  <line x1="366.0" y1="130.0" x2="370.0" y2="130.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="362.0" y="134.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">0.5</text>
  <line x1="370.0" y1="130.0" x2="580.0" y2="130.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.12"/>
  <line x1="366.0" y1="50.0" x2="370.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="362.0" y="54.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.8">1</text>
  <line x1="370.0" y1="50.0" x2="580.0" y2="50.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.12"/>
  <rect x="384.0" y="113.4" width="42.0" height="96.6" fill="#21918c" fill-opacity="0.55" stroke="#21918c" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="405.0" y="107.4" font-size="11" fill="currentColor" text-anchor="middle">0.60</text>
  <text x="405.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">cat</text>
  <rect x="454.0" y="151.4" width="42.0" height="58.6" fill="#21918c" fill-opacity="0.55" stroke="#21918c" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="475.0" y="145.4" font-size="11" fill="currentColor" text-anchor="middle">0.37</text>
  <text x="475.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">lion</text>
  <rect x="524.0" y="205.2" width="42.0" height="4.8" fill="#21918c" fill-opacity="0.55" stroke="#21918c" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="545.0" y="199.2" font-size="11" fill="currentColor" text-anchor="middle">0.03</text>
  <text x="545.0" y="228.0" font-size="12" fill="currentColor" text-anchor="middle">iguana</text>
  <text x="475.0" y="30.0" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">softmax</text>
  <text x="475.0" y="256.0" font-size="12" fill="#21918c" text-anchor="middle">outputs sum to 1.00</text>
</svg>
