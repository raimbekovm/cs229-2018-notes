  <title id="figJensenTitle">Jensen's inequality as a chord</title>
  <desc id="figJensenDesc">A convex curve with the chord joining its values at x equals 1 and x equals 5. For X equal to 1 or 5 with probability one half each, the midpoint of the chord is the expected value of f of X, and it lies above the curve at 3, which is f of the expected value of X.</desc>
