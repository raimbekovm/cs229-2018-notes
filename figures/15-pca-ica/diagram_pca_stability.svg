  <title id="figPcaStabTitle">Stability of a principal direction against stability of a principal subspace</title>
  <desc id="figPcaStabDesc">Median angle, over two hundred pairs of samples of 200 points from the same three-dimensional distribution, between the two samples' first eigenvectors and between their two-dimensional principal subspaces, plotted against the ratio of the second to the first eigenvalue. The first eigenvector's angle stays small until the ratio nears one and then climbs steeply; the subspace angle stays near zero throughout.</desc>
