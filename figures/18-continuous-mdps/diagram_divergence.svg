  <title id="figDivergenceTitle">Fitted value iteration diverging on a two-state chain</title>
  <desc id="figDivergenceDesc">Base-ten logarithm of the size of the single parameter theta against the iteration, starting from theta equal to one, for Tsitsiklis and Van Roy's two-state example, whose true value function is zero and is represented exactly by theta equal to zero. At discount 0.9 the parameter grows steadily, passing a thousand after 90 iterations; at 0.8 it shrinks slowly; ordinary value iteration on the same two states at 0.9, started from the same values, falls by a factor of 0.9 per sweep.</desc>
