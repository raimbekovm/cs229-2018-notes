  <title id="figGainsTitle">LQR gains over the horizon, with and without noise</title>
  <desc id="figGainsDesc">The two entries of the optimal gain L_t, which multiplies position and velocity to give the force, against the time step for a cart with a 60-step horizon. Both are flat, at about minus 2.76 and minus 2.51, for the first half of the horizon and relax to zero over the last 25 or so steps, reaching zero at the final step. Curves for zero noise and circles for large noise coincide exactly.</desc>
