  <title id="socialCardTitle">CS229 2018 Lecture Notes</title>
  <desc id="socialCardDesc">Filled contour lines of a quadratic cost over two parameters, purple at the rim and yellow at the minimum, elongated and tilted. A white path of dots starts on the outer slope and zig-zags across the narrow axis of the bowl while creeping along the long one until it reaches the centre: batch gradient descent with a step size close to the largest stable one.</desc>
