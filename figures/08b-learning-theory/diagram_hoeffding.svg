  <title id="figHoeffdingTitle">Hoeffding's inequality against the exact tail</title>
  <desc id="figHoeffdingDesc">The probability that the mean of m Bernoulli draws misses its parameter by more than 0.1, computed exactly from the binomial distribution for φ = 0.5 and φ = 0.15, lies below Hoeffding's bound at every m. The bound has the right exponential rate and is loosest when φ is far from one half.</desc>
