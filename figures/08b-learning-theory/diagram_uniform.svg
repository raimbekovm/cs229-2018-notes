  <title id="figUniformTitle">Empirical error curves around the true error curve</title>
  <desc id="figUniformDesc">A finite class of ten threshold classifiers. The solid curve is each hypothesis's true error, lowest at t = 0.35 and 0.45 where the class comes closest to the real threshold 0.4. The dashed curves are training errors on three samples of sixty examples; they scatter around the true curve, and the hypothesis with the lowest training error on the first sample is circled, with its true error marked above it.</desc>
