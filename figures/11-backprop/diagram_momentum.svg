<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316"
     role="img" aria-labelledby="figMomentumTitle figMomentumDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figMomentumTitle">Gradient descent and momentum on an elongated bowl</title>
  <desc id="figMomentumDesc">Contours of a quadratic 100 times steeper vertically than horizontally, with the first 60 steps of two methods from the same start. Gradient descent at its best fixed learning rate bounces between the walls of the valley and creeps along its floor. Momentum, stepping along an exponential average of past gradients, cancels the alternating vertical components, which lets it use a learning rate three times past the one at which gradient descent diverges, and it runs along the valley floor to the minimum.</desc>
