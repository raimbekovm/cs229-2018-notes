  <line x1="146.0" y1="96.0" x2="146.0" y2="164.0" stroke="#440154" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <circle cx="146.0" cy="176.0" r="10.0" fill="#440154" fill-opacity="0.2" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="146.0" y="180.0" font-size="12" fill="currentColor" text-anchor="middle">δ</text>
  <text x="146.0" y="208.0" font-size="11" fill="#440154" text-anchor="middle">δ[1] = W[2]ᵀδ[2] ∘ a[1](1−a[1])</text>
  <text x="146.0" y="226.0" font-size="11" fill="currentColor" text-anchor="middle">∂L/∂W[1] = δ[1] xᵀ</text>
