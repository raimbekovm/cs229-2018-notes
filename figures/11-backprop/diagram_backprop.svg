<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 278" width="770" height="278"
     role="img" aria-labelledby="figBackpropTitle figBackpropDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="figBackpropTitle">Forward and backward passes through the 3-2-1 network</title>
  <desc id="figBackpropDesc">Top row, left to right: x, then the linear part and activation of each of the three layers, then the loss; each value is cached as it is computed. Bottom row, right to left: the error δ[3] = a[3] − y at the output, then δ[2] obtained from δ[3] by multiplying by the transpose of W[3] and entrywise by the sigmoid's derivative a[2](1 − a[2]), then δ[1] from δ[2] the same way. Each layer's weight gradient is its δ times the transpose of the activation that fed it.</desc>
