  <text x="482.0" y="54.0" font-size="10" fill="#21918c" text-anchor="middle">W[3]a[2]+b[3]</text>
  <text x="578.0" y="54.0" font-size="10" fill="#21918c" text-anchor="middle">σ</text>
  <text x="674.0" y="54.0" font-size="10" fill="#21918c" text-anchor="middle">loss</text>
  <text x="30.0" y="30.0" font-size="12" fill="#21918c" text-anchor="start" font-weight="600">forward: compute and cache</text>
  <line x1="530.0" y1="96.0" x2="530.0" y2="164.0" stroke="#440154" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <circle cx="530.0" cy="176.0" r="10.0" fill="#440154" fill-opacity="0.2" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="530.0" y="180.0" font-size="12" fill="currentColor" text-anchor="middle">δ</text>
  <text x="530.0" y="208.0" font-size="11" fill="#440154" text-anchor="middle">δ[3] = a[3] − y</text>
  <text x="530.0" y="226.0" font-size="11" fill="currentColor" text-anchor="middle">∂L/∂W[3] = δ[3] a[2]ᵀ</text>
  <line x1="338.0" y1="96.0" x2="338.0" y2="164.0" stroke="#440154" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <circle cx="338.0" cy="176.0" r="10.0" fill="#440154" fill-opacity="0.2" stroke="#440154" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="338.0" y="180.0" font-size="12" fill="currentColor" text-anchor="middle">δ</text>
  <text x="338.0" y="208.0" font-size="11" fill="#440154" text-anchor="middle">δ[2] = W[3]ᵀδ[3] ∘ a[2](1−a[2])</text>
  <text x="338.0" y="226.0" font-size="11" fill="currentColor" text-anchor="middle">∂L/∂W[2] = δ[2] a[1]ᵀ</text>
  <line x1="518.0" y1="176.0" x2="356.0" y2="176.0" stroke="#440154" stroke-width="1.4" stroke-opacity="0.85"/>
