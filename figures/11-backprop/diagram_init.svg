  <title id="figInitTitle">Signal size through a deep ReLU network</title>
  <desc id="figInitDesc">The root-mean-square of the pre-activations at each of 30 layers of a ReLU network 64 units wide, on a log base 2 scale, for weights drawn with variance 1/n, 2/n and 4/n. With 1/n the signal halves in mean square at every layer and falls by about fifteen powers of two in 30 layers; with 4/n it doubles and grows by as much; with 2/n, the He initialisation, it stays level.</desc>
